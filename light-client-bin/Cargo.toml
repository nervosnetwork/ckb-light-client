[package]
name = "ckb-light-client"
version = "0.5.5"
authors = ["Nervos Core Dev <dev@nervos.org>"]
edition = "2021"
license = "MIT"
description = "A CKB light client based on FlyClient."
homepage = "https://github.com/nervosnetwork/ckb-light-client"
repository = "https://github.com/nervosnetwork/ckb-light-client"

[dependencies]
ckb-async-runtime = "1"
ckb-chain-spec = "1"
ckb-network = "1"
ckb-stop-handler = "1"
ckb-resource = "1"
ckb-jsonrpc-types = "1"
ckb-types = "1"
ckb-traits = "1"
ckb-systemtime = "1"

ckb-light-client-lib = { path = "../light-client-lib", default-features = false }
clap = { version = "4", features = ["cargo"] }
log = "0.4"
ctrlc = { version = "3.2.1", features = ["termination"] }
jsonrpc-core = "18.0"
jsonrpc-derive = "18.0"
jsonrpc-http-server = "18.0"
jsonrpc-server-utils = "18.0"
rocksdb = { package = "ckb-rocksdb", version = "=0.21.1", features = [
    "snappy",
], default-features = false, optional = true }
env_logger = "0.11"
anyhow = "1.0.56"
openssl = { version = "0.10", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[build-dependencies]
vergen-gitcl = { version = "1", default-features = false }
chrono = "0.4"

[dev-dependencies]
rand = "0.8"
serde_json = "1.0"
tempfile = "3.0"

[features]
default = ["rocksdb", "ckb-light-client-lib/rocksdb"]
portable = ["rocksdb", "rocksdb/portable", "ckb-light-client-lib/rocksdb"]
march-native = ["rocksdb", "rocksdb/march-native", "ckb-light-client-lib/rocksdb"]
sqlite = ["ckb-light-client-lib/sqlite"]
rocksdb = ["dep:rocksdb"]
vendored-openssl = ["openssl/vendored"]

# [profile.release]
# overflow-checks = true

[badges]
maintenance = { status = "experimental" }
